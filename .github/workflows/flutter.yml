name: Flutter quality gate

on:
  push:
    branches: [master]
    paths:
      - fpfa_app/**
  pull_request:
    branches: [master]
    paths:
      - fpfa_app/**

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.6

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: fpfa_app

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
        working-directory: fpfa_app

      - name: Analyze project
        run: flutter analyze
        working-directory: fpfa_app

      - name: Run tests
        run: flutter test
        working-directory: fpfa_app

      - name: Verify application boot
        run: flutter test -d flutter-tester integration_test/app_test.dart
        working-directory: fpfa_app
