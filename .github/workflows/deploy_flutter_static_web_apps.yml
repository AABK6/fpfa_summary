name: Test and deploy Flutter web

on:
  push:
    branches:
      - master
    paths:
      - fpfa_app/**
      - scripts/smoke_test_web.py
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy_flutter_static_web_apps.yml
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'ppf-fpfa-summary-prod' }}
  API_BASE_URL_PROD: ${{ vars.API_BASE_URL_PROD || 'https://fpfa-summary-api-1076204999548.europe-west1.run.app' }}
  WEB_BASE_URL_PROD: ${{ vars.WEB_BASE_URL_PROD || 'https://ppf-fpfa-summary-prod.web.app' }}
  FLUTTER_VERSION: 3.44.6

jobs:
  test-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: fpfa_app

      - name: Enforce formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
        working-directory: fpfa_app

      - name: Analyze
        run: flutter analyze
        working-directory: fpfa_app

      - name: Run tests
        run: flutter test
        working-directory: fpfa_app

      - name: Verify application boot
        run: flutter test -d flutter-tester integration_test/app_test.dart
        working-directory: fpfa_app

      - name: Compile production web bundle
        run: flutter build web --release --dart-define=API_BASE_URL=${API_BASE_URL_PROD}
        working-directory: fpfa_app

      - name: Preserve tested web bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fpfa-web-${{ github.sha }}
          path: fpfa_app/build/web
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    runs-on: ubuntu-latest
    needs: test-web
    environment:
      name: Production
      url: ${{ env.WEB_BASE_URL_PROD }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore tested web bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fpfa-web-${{ github.sha }}
          path: fpfa_app/build/web

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Deploy to Firebase Hosting
        run: firebase deploy --project "${GCP_PROJECT_ID}" --only hosting --non-interactive

      - name: Set up Python for browser smoke test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install browser smoke dependencies
        run: pip install playwright==1.57.0 requests==2.33.0

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify the deployed reader
        run: >-
          python scripts/smoke_test_web.py
          --base-url "${WEB_BASE_URL_PROD}"
          --api-base-url "${API_BASE_URL_PROD}"

      - name: Preserve responsive smoke screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fpfa-web-smoke-${{ github.run_id }}
          path: output/playwright/web-smoke/*.png
          if-no-files-found: error
          retention-days: 14
